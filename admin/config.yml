# Decap CMS: lets the clowns add and edit events at /admin without touching code.
# Saving an event commits content/events.json to GitHub; Hostinger then auto-deploys it.
backend:
  name: github
  repo: GainRangerHeffe/erieclowns
  branch: main
  base_url: https://eriesistibleclowns.com  # TODO: the live domain
  auth_endpoint: admin/oauth/auth.php
  commit_messages:
    update: "Update events"
    uploadMedia: "Upload {{path}}"

# Uncomment to edit locally with `npx decap-server`
# local_backend: true

site_url: https://eriesistibleclowns.com
display_url: https://eriesistibleclowns.com
logo_url: https://eriesistibleclowns.com/assets/img/logo.png
media_folder: assets/img/uploads
public_folder: /assets/img/uploads

collections:
  - name: calendar
    label: Events
    editor:
      preview: false
    files:
      - name: events
        label: Events calendar
        file: content/events.json
        format: json
        fields:
          - label: Events
            name: events
            label_singular: Event
            widget: list
            summary: "{{fields.start | date('MMM D, YYYY')}} · {{fields.title}}"
            add_to_top: true
            fields:
              - { label: Title, name: title, widget: string }
              - label: Type
                name: type
                widget: select
                required: false
                options: [Parade, Community event, Fundraiser, Clown College, Hall event, Hospital visit, Members only]
              - { label: Starts, name: start, widget: datetime, format: "YYYY-MM-DDTHH:mm", picker_utc: false }
              - { label: Ends, name: end, widget: datetime, format: "YYYY-MM-DDTHH:mm", picker_utc: false, required: false }
              - { label: Place name, name: location, widget: string, hint: "e.g. Presque Isle State Park", required: false }
              - { label: Street address, name: address, widget: string, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Photo or flyer, name: image, widget: image, required: false }
              - { label: Link for more details, name: link, widget: string, required: false, hint: "Facebook event or sign-up page" }
